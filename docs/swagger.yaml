basePath: /api/v1
definitions:
  internal_delivery_http.CalculatePremiumRequest:
    properties:
      age:
        type: integer
      payment_term:
        type: integer
      sum_assured:
        type: integer
    type: object
  internal_delivery_http.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  internal_delivery_http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_delivery_http.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  internal_delivery_http.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  internal_delivery_http.SemanticSearchRequest:
    properties:
      limit:
        type: integer
      query:
        type: string
    type: object
  internal_delivery_http.UpdatePreferencesRequest:
    properties:
      claim_notification_emails:
        type: boolean
      newsletter_emails:
        type: boolean
      policy_update_emails:
        type: boolean
      promotional_emails:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@insurance.example.com
    name: API Support
  description: |-
    API komprehensif untuk sistem manajemen asuransi dengan fitur aplikasi, polis, klaim, billing, dokumen, notifikasi, fraud detection, OCR, dan analytics

    **Fitur Utama:**
    - Autentikasi & Otorisasi berbasis JWT dengan RBAC (Role-Based Access Control)
    - Manajemen Produk Asuransi dengan semantic search
    - Aplikasi Asuransi dengan AI review dan fraud detection
    - Manajemen Polis (endorsement, renewal)
    - Klaim dengan timeline tracking
    - Billing & Payment terintegrasi Midtrans
    - Document Management dengan MinIO
    - OCR untuk ekstraksi KTP
    - Real-time Notifications via WebSocket
    - Analytics & Reporting
    - Audit Logging

    **RBAC Roles:**
    - `customer`: Akses dasar untuk pengguna
    - `underwriter`: Approve aplikasi, risk analysis
    - `claims_officer`: Manajemen klaim
    - `finance`: Billing & invoice management
    - `super_admin`: Full access
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Insurance Policy Core API
  version: "1.0"
paths:
  /api/v1/notification-preferences:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get notification preferences
      tags:
      - notification-preferences
    put:
      consumes:
      - application/json
      parameters:
      - description: Preferences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.UpdatePreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update notification preferences
      tags:
      - notification-preferences
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Mengirim email reset password ke alamat email terdaftar
      parameters:
      - description: Email untuk reset password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email reset password telah dikirim
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Email is required
          schema:
            additionalProperties: true
            type: object
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentikasi user dengan email dan password, mengembalikan JWT token
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil dengan token dan informasi user
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Email atau password salah
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Menghapus cookie autentikasi dan melakukan logout
      produces:
      - application/json
      responses:
        "200":
          description: Logout berhasil
          schema:
            additionalProperties: true
            type: object
      summary: Logout user
      tags:
      - Auth
  /auth/me:
    get:
      description: Mendapatkan informasi user yang sedang login berdasarkan JWT token
      produces:
      - application/json
      responses:
        "200":
          description: Informasi user
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun user baru dengan email, password, nama lengkap,
        dan nomor telepon
      parameters:
      - description: Request body untuk registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User berhasil didaftarkan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body atau email sudah terdaftar
          schema:
            additionalProperties: true
            type: object
      summary: Register user baru
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Mengatur password baru menggunakan token reset yang diterima via
        email
      parameters:
      - description: Token dan password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil direset
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Token invalid atau password terlalu pendek
          schema:
            additionalProperties: true
            type: object
      summary: Reset password
      tags:
      - Auth
  /products:
    get:
      description: Mendapatkan daftar produk asuransi dengan filter dan pagination
      parameters:
      - description: Filter berdasarkan kategori (health, life, vehicle, property)
        in: query
        name: category
        type: string
      - description: Filter produk aktif/nonaktif
        in: query
        name: is_active
        type: boolean
      - default: 10
        description: Jumlah data per halaman
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List produk
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: List produk asuransi
      tags:
      - Products
  /products/{id}:
    get:
      description: Mendapatkan detail lengkap produk asuransi berdasarkan ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail produk
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties: true
            type: object
      summary: Get detail produk
      tags:
      - Products
  /products/{id}/calculate-premium:
    post:
      consumes:
      - application/json
      description: Menghitung estimasi premi berdasarkan usia, sum assured, dan payment
        term
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Parameter kalkulasi premi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.CalculatePremiumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Hasil kalkulasi premi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
      summary: Hitung premi asuransi
      tags:
      - Products
  /products/search:
    post:
      consumes:
      - application/json
      description: Mencari produk asuransi menggunakan natural language query
      parameters:
      - description: Query pencarian
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.SemanticSearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Hasil pencarian
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Query is required
          schema:
            additionalProperties: true
            type: object
      summary: Semantic search produk
      tags:
      - Products
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT Authorization header menggunakan Bearer scheme. Format: "Bearer
      {token}"'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: JWT token stored in HTTP-only cookie
    in: cookie
    name: auth_token
    type: apiKey
swagger: "2.0"
